<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="小鹿学姐的学习、保研与科研分享。">
<title>问小鹿 · 来聊聊学习与科研</title>
<style>
:root{--bg:#f5f4ee;--paper:#fffefa;--ink:#233b31;--muted:#748074;--line:#e2e7dc;--green:#385b48;--light:#eaf0e4;--pink:#ead9d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #c2d4ad;outline-offset:3px}.shell{max-width:1060px;margin:auto;padding:28px 30px 22px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.brand{display:flex;gap:12px;align-items:center}.mark{width:43px;height:43px;background:var(--green);border-radius:14px;display:grid;place-items:center;font-size:25px}.brand strong{font-size:20px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:1px}.tag{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:#8aa177}.layout{display:grid;grid-template-columns:270px 1fr;gap:30px}.intro{padding-top:15px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:2px;margin:0 0 17px}h1{font-family:"Songti SC","STSong",serif;font-size:36px;line-height:1.52;font-weight:500;letter-spacing:1px;margin:0 0 18px}.intro p{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 28px}.topics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:36px}.topics span{font-size:11px;padding:6px 10px;border:1px solid #d9e1d2;border-radius:20px;color:#65765f}.side-note{border-top:1px solid #dce2d4;padding-top:20px}.side-note strong{font-size:12px;font-weight:600}.side-note p{font-size:11px;line-height:1.9;margin-top:9px}.chat{height:min(760px,calc(100vh - 135px));min-height:540px;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 45px #283b2010;overflow:hidden}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.chat-head .title{font-size:13px;font-weight:600}.chat-head small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.clear{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px}.clear:hover{color:var(--ink)}.messages{padding:25px 22px;overflow-y:auto;flex:1;scroll-behavior:smooth}.message{margin-bottom:22px;animation:arrive .2s ease-out}.label{font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.8px}.body{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.user{display:flex;flex-direction:column;align-items:flex-end}.user .label{text-align:right}.user .body{background:var(--light);border-radius:15px 15px 3px 15px;padding:12px 16px;max-width:88%;color:#354c3b}.assistant .body{padding:0 1px}.welcome .body{font-size:15px}.welcome-title{font-family:"Songti SC",serif;font-size:24px;margin:0 0 12px;font-weight:500}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.chip{border:1px solid var(--line);background:#fafbf6;color:#546c53;font-size:12px;padding:9px 12px;border-radius:10px;text-align:left;line-height:1.5}.chip:hover{background:var(--light);border-color:#cbd7c3}.suggest-title{font-size:10px;color:var(--muted);margin-top:18px}.rec-title{font-size:11px;color:var(--muted);margin-top:18px;margin-bottom:9px}.post{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:8px;background:#fff}.post:hover{border-color:#b8cbae;background:#fafcf6}.post-top{display:flex;align-items:flex-start;gap:9px;justify-content:space-between}.post-kind{font-size:9px;color:#76916d;background:#edf2e8;padding:3px 5px;border-radius:4px;flex-shrink:0}.post-name{font-size:12px;font-weight:550;line-height:1.6;flex:1}.arrow{font-size:16px;color:#7c9175}.post p{font-size:11px;color:var(--muted);line-height:1.6;margin:7px 0 0}.composer{padding:13px 18px 15px;border-top:1px solid var(--line);background:#fdfdf8}.input-wrap{border:1px solid #dbe3d3;border-radius:15px;background:#fff;padding:10px 11px 10px 14px;display:flex;gap:10px;align-items:flex-end}textarea{border:0;outline:0;background:transparent;resize:none;flex:1;width:100%;height:46px;max-height:110px;color:var(--ink);font-size:13px;line-height:1.7;padding:2px 0}textarea::placeholder{color:#9aa493}.send{border:0;background:var(--green);color:white;width:39px;height:37px;border-radius:11px;font-size:20px;flex-shrink:0}.send:hover{background:#294b38}.send:disabled{opacity:.45;cursor:default}.hint{font-size:9px;color:#9aa18f;margin-top:9px;display:flex;justify-content:space-between;gap:10px}.loading{color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center}.loading i{height:5px;width:5px;background:#a5b699;border-radius:50%;animation:pulse 1s infinite}.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}.error .body{color:#9a6856}footer{font-size:10px;color:#9aa18f;text-align:center;margin-top:22px}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:760px){.shell{padding:18px 14px 12px}header{margin-bottom:20px}.layout{grid-template-columns:1fr;gap:16px}.intro{padding:0 5px}.eyebrow{display:none}h1{font-size:26px;line-height:1.4;margin:0 0 8px}h1 br{display:none}.intro p{margin:0;font-size:12px}.topics,.side-note{display:none}.chat{height:calc(100dvh - 207px);min-height:480px;border-radius:20px}.chat-head{padding:14px 17px}.messages{padding:22px 17px}.tag{font-size:10px}.brand strong{font-size:18px}.brand small{font-size:9px}.mark{width:36px;height:36px;font-size:22px}.body{font-size:13px}.welcome-title{font-size:21px}footer{margin-top:14px}.hint span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand"><div class="mark" aria-hidden="true">🦌</div><div><strong>问小鹿</strong><small>A LITTLE GUIDANCE, A LITTLE GROWTH</small></div></div><div class="tag"><span class="dot"></span>一起慢慢找到方向</div></header>
<div class="layout">
<aside class="intro"><div class="eyebrow">XIAOLU'S NOTES</div><h1>学习和科研，<br>来聊聊你的问题。</h1><p>博士在读，分享学习、科研与AI工具经验。<br><a href="https://www.rednote.com/user/profile/5f9e4300000000000101d3d3" target="_blank" rel="noopener noreferrer" style="color:inherit">在小红书找到我 ↗</a></p><div class="topics"><span>保研 · 复试</span><span>大学学习</span><span>科研工具</span></div><div class="side-note"><strong>先从一个具体的问题开始</strong><p>说说你现在的阶段、遇到的困惑，<br>回答会更贴近你的需要。<br><br>这是小鹿内容 AI 助手，<br>资料不足时，会直接告诉你。</p></div></aside>
<section class="chat" aria-label="问小鹿聊天">
<div class="chat-head"><div><div class="title">小鹿内容小助手</div><small>聊经验，也帮你找到原分享</small></div><button class="clear" id="clear" type="button">重新开始 ↻</button></div>
<div class="messages" id="messages" role="log" aria-live="polite" aria-label="聊天记录"></div>
<form class="composer" id="form"><div class="input-wrap"><textarea id="question" aria-label="你的问题" maxlength="1500" placeholder="比如：我大二，想保研，先准备什么？" rows="2"></textarea><button class="send" id="send" type="submit" aria-label="发送问题">↑</button></div><div class="hint"><span>回答参考小鹿的公开分享，具体要求以学校当年通知为准</span><span>Enter 发送 · Shift + Enter 换行</span></div></form>
</section></div><footer>愿这些经验，能陪你少走一点弯路。</footer>
</main>
<script src="./site-config.js"></script>
<script>
const apiBase=(window.ASKXIAOLU_API_BASE||'').replace(/\/$/,'');
let history=[];
let session=crypto.randomUUID(),busy=false;
const log=document.querySelector('#messages'),input=document.querySelector('#question'),send=document.querySelector('#send');
const defaults=['保研材料怎么准备？','第一次联系导师，邮件怎么写？','自我介绍PPT怎么组织？','怎么用Zotero整理文献？'];
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function scrollDown(){log.scrollTop=log.scrollHeight;}
function chips(parent,questions){const wrap=el('div','chips');questions.forEach(q=>{const b=el('button','chip',q);b.type='button';b.addEventListener('click',()=>ask(q));wrap.append(b);});parent.append(wrap);}
function welcome(){log.replaceChildren();const wrap=el('div','message assistant welcome');wrap.append(el('div','label','小鹿内容小助手'),el('h2','welcome-title','嗨，很高兴见到你～'));wrap.append(el('div','body','保研、复试、大学学习或科研工具，你想先聊哪一个？\n我会先给你一点实用思路，再推荐小鹿的相关分享。'));chips(wrap,defaults);log.append(wrap);}
function message(who,text){const box=el('div','message '+who);box.append(el('div','label',who==='user'?'你':'小鹿内容小助手'));box.append(el('div','body',text));log.append(box);scrollDown();return box;}
function result(data){const box=message('assistant',data.answer);if(data.recommendations?.length){box.append(el('div','rec-title','接着看这些分享 ↗'));data.recommendations.forEach(r=>{if(!/^https:\/\/xhslink\.cn\/o\/[A-Za-z0-9]+$/.test(r.url))return;const a=el('a','post');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';const top=el('div','post-top');top.append(el('span','post-kind',r.kind==='video'?'视频':'图文'),el('span','post-name',r.title),el('span','arrow','↗'));a.append(top,el('p','',r.reason));box.append(a);});}if(data.suggested_questions?.length){box.append(el('div','suggest-title','也可以这样问'));chips(box,data.suggested_questions);}scrollDown();}
async function ask(q){q=q.trim();if(!q||busy)return;if(location.hostname==='askxiaolu.github.io'&&!apiBase){message('assistant','问答正在连接中，请稍后再来看看～');return;}busy=true;send.disabled=true;input.disabled=true;input.value='';message('user',q);const loading=el('div','message assistant');loading.append(el('div','label','小鹿内容小助手'));const dots=el('div','loading');dots.append(el('span','','让我想想怎么帮你'));for(let i=0;i<3;i++)dots.append(el('i'));loading.append(dots);log.append(loading);scrollDown();try{const response=await fetch(apiBase+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history})});const data=await response.json();loading.remove();if(!response.ok)throw new Error(data.error||'这次没有连接上，稍后再试一下吧～');result(data);if(data.status==='answer'){history.push({role:'user',content:q},{role:'assistant',content:data.answer});history=history.slice(-6);}}catch(error){loading.remove();message('assistant error',error.message||'这次没有连接上，稍后再试一下吧～');}finally{busy=false;send.disabled=false;input.disabled=false;input.focus();}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(input.value);}});
document.querySelector('#clear').addEventListener('click',async()=>{if(busy)return;history=[];session=crypto.randomUUID();welcome();input.focus();});
welcome();
</script>
</body></html>
