<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="小鹿学姐的科研、AI工具与学习分享。"><title>Ask Xiaolu · 小鹿学姐</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f5;color:#293b32;font:14px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:740px;margin:42px auto 24px;padding:0 20px}.brand{font:20px Georgia,serif;color:#41634d}h1{font-size:27px;font-weight:550;margin:19px 0 5px}.intro{color:#747e75;margin:0;font-size:13px}.profile{display:inline-block;margin-top:9px;color:#4c6a55;font-size:12px;text-underline-offset:3px}.chat{margin-top:24px;background:white;border:1px solid #dfe4dc;border-radius:15px;overflow:hidden}.chat-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0e9}.title{font-weight:550;font-size:14px}.clear{font:inherit;font-size:11px;border:0;background:none;color:#859080;cursor:pointer}.messages{height:420px;max-height:57vh;min-height:290px;overflow-y:auto;padding:22px 18px}.message{margin-bottom:21px}.label{font-size:10px;color:#97a08f;margin-bottom:6px}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.user{display:flex;flex-direction:column;align-items:flex-end}.user .body{background:#edf2e7;padding:10px 14px;border-radius:12px;max-width:90%}.welcome-title{font-size:17px;font-weight:500;margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border:1px solid #e2e7dc;background:#fafbf7;color:#5b7054;border-radius:8px;padding:6px 9px;font:inherit;font-size:11px;cursor:pointer}.chip:hover{background:#edf2e7}.suggest-title,.rec-title{font-size:11px;color:#8b9583;margin-top:15px}.post{display:block;text-decoration:none;color:inherit;border:1px solid #e5e9df;border-radius:9px;padding:10px 12px;margin-top:7px}.post:hover{background:#fafbf7}.post-top{display:flex;gap:9px;align-items:flex-start}.post-kind{font-size:9px;color:#7c8d72;background:#f0f4eb;border-radius:3px;padding:1px 4px;flex-shrink:0}.post-name{font-size:12px;flex:1;line-height:1.7}.arrow{color:#8b9b80}.post p{margin:5px 0 0;font-size:11px;color:#8a9482}.composer{padding:12px 15px;border-top:1px solid #edf0e9}.input-wrap{display:flex;gap:10px;align-items:flex-end;border:1px solid #dfe5d8;border-radius:10px;padding:10px 11px}textarea{resize:none;flex:1;min-width:0;width:100%;height:43px;border:0;outline:none;background:none;color:#293b32;font:inherit;font-size:13px}textarea::placeholder{color:#9aa491}.send{width:35px;height:34px;border:0;border-radius:8px;background:#41634d;color:white;font-size:19px;cursor:pointer}.send:disabled{opacity:.4}.hint{color:#9ba38f;font-size:10px;margin-top:7px}.loading{color:#8b9583;font-size:12px}.error .body{color:#986652}footer{font-size:10px;color:#a0a695;text-align:center;margin-top:18px}button:focus-visible,a:focus-visible{outline:2px solid #9eb68b;outline-offset:3px}@media(max-width:520px){main{margin-top:25px;padding:0 14px}h1{font-size:24px}.messages{height:54vh;min-height:290px}.post p{font-size:11px}}
</style></head><body><main>
<div class="brand">askxiaolu.</div><h1>你好，我是小鹿学姐。</h1><p class="intro">博士在读，分享科研、AI 工具和学习经验。</p><a class="profile" href="https://www.rednote.com/user/profile/5f9e4300000000000101d3d3" target="_blank" rel="noopener noreferrer">在小红书找到我 ↗</a>
<section class="chat" aria-label="问小鹿聊天"><div class="chat-head"><div class="title">问小鹿</div><button id="clear" class="clear" type="button">重新开始 ↻</button></div><div class="messages" id="messages" role="log" aria-live="polite" aria-label="聊天记录"></div><form class="composer" id="form"><div class="input-wrap"><textarea id="question" aria-label="你的问题" maxlength="1500" placeholder="想聊聊什么？" rows="2"></textarea><button id="send" class="send" type="submit" aria-label="发送问题">↑</button></div><div class="hint">AI 内容助手 · 根据小鹿的公开分享整理，非本人实时回复。</div></form></section><footer>© 2026 Ask Xiaolu</footer></main>
<script src="./site-config.js?v=3581789"></script>
<script>
const apiBase=(window.ASKXIAOLU_API_BASE||'').replace(/\/$/,'');
let history=[];
let session=crypto.randomUUID(),busy=false;
const log=document.querySelector('#messages'),input=document.querySelector('#question'),send=document.querySelector('#send');
const defaults=['保研材料怎么准备？','第一次联系导师，邮件怎么写？','自我介绍PPT怎么组织？','怎么用Zotero整理文献？'];
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function scrollDown(){log.scrollTop=log.scrollHeight;}
function chips(parent,questions){const wrap=el('div','chips');questions.forEach(q=>{const b=el('button','chip',q);b.type='button';b.addEventListener('click',()=>ask(q));wrap.append(b);});parent.append(wrap);}
function welcome(){log.replaceChildren();const wrap=el('div','message assistant welcome');wrap.append(el('div','label','小鹿内容小助手'),el('h2','welcome-title','嗨，很高兴见到你～'));wrap.append(el('div','body','保研、学习或科研工具，你想先聊哪一个？我会给你一些思路，再推荐相关分享。'));chips(wrap,defaults);log.append(wrap);}
function message(who,text){const box=el('div','message '+who);box.append(el('div','label',who==='user'?'你':'小鹿内容小助手'));box.append(el('div','body',text));log.append(box);scrollDown();return box;}
function result(data){const box=message('assistant',data.answer);if(data.recommendations?.length){box.append(el('div','rec-title','接着看这些分享 ↗'));data.recommendations.forEach(r=>{if(!/^https:\/\/xhslink\.cn\/o\/[A-Za-z0-9]+$/.test(r.url))return;const a=el('a','post');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';const top=el('div','post-top');top.append(el('span','post-kind',r.kind==='video'?'视频':'图文'),el('span','post-name',r.title),el('span','arrow','↗'));a.append(top,el('p','',r.reason));box.append(a);});}if(data.suggested_questions?.length){box.append(el('div','suggest-title','也可以这样问'));chips(box,data.suggested_questions);}scrollDown();}
async function ask(q){q=q.trim();if(!q||busy)return;if(location.hostname==='askxiaolu.github.io'&&!apiBase){message('assistant','问答正在连接中，请稍后再来看看～');return;}busy=true;send.disabled=true;input.disabled=true;input.value='';message('user',q);const loading=el('div','message assistant');loading.append(el('div','label','小鹿内容小助手'));const dots=el('div','loading');dots.append(el('span','','让我想想怎么帮你'));for(let i=0;i<3;i++)dots.append(el('i'));loading.append(dots);log.append(loading);scrollDown();try{const response=await fetch(apiBase+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history})});const data=await response.json();loading.remove();if(!response.ok)throw new Error(data.error||'这次没有连接上，稍后再试一下吧～');result(data);if(data.status==='answer'){history.push({role:'user',content:q},{role:'assistant',content:data.answer});history=history.slice(-6);}}catch(error){loading.remove();message('assistant error',error.message||'这次没有连接上，稍后再试一下吧～');}finally{busy=false;send.disabled=false;input.disabled=false;input.focus();}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(input.value);}});
document.querySelector('#clear').addEventListener('click',async()=>{if(busy)return;history=[];session=crypto.randomUUID();welcome();input.focus();});
welcome();
</script>
</body></html>
