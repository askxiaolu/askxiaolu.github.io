<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="小鹿学姐的个人小站。科研日常、AI 工具与学习分享。">
<title>Ask Xiaolu · 小鹿学姐</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;background:#f8f8f5;color:#293b32;font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:740px;margin:65px auto 35px;padding:0 24px}
.brand{font:23px Georgia,serif;letter-spacing:-.7px;color:#41634d}
h1{font-size:30px;font-weight:550;letter-spacing:-.8px;margin:27px 0 10px}
.intro{color:#68716a;margin:0;max-width:570px}
.profile{display:inline-block;font-size:13px;color:#4c6a55;text-underline-offset:4px;margin-top:12px}
.chat{background:white;border:1px solid #dfe4dc;border-radius:14px;margin-top:30px;overflow:hidden}
.chat-head{padding:17px 22px;border-bottom:1px solid #e9ece6;display:flex;gap:14px;align-items:center;justify-content:space-between}
h2{font-size:15px;font-weight:550;margin:0}
.status{font-size:11px;color:#7a827b;background:#f1f3ee;border-radius:20px;padding:3px 10px}
.messages{min-height:240px;padding:28px 22px;display:flex;align-items:center;justify-content:center}
.welcome{max-width:420px;text-align:center}
.welcome strong{font-size:18px;font-weight:500}
.welcome p{color:#737c75;font-size:13px;line-height:1.9;margin:12px 0 0}
form{padding:0 18px 18px}
.composer{border:1px solid #e1e5dd;border-radius:10px;background:#fafbf8;padding:12px;display:flex;gap:10px;align-items:end}
textarea{resize:vertical;min-height:50px;max-height:150px;flex:1;width:100%;border:0;background:transparent;font:inherit;outline:none;color:#7a827c}
textarea::placeholder{color:#929991}
button{border:0;border-radius:7px;padding:9px 15px;background:#e7ebe3;color:#8b958c;font:13px inherit;white-space:nowrap;cursor:not-allowed}
.note{font-size:11px;color:#818980;padding:9px 2px 0;margin:0}
footer{margin-top:27px;color:#92988f;font-size:11px;text-align:center}
a:focus-visible{outline:2px solid #41634d;outline-offset:4px}
@media(max-width:520px){main{margin-top:35px;padding:0 18px}h1{font-size:27px}.messages{min-height:215px;padding:22px 20px}.chat{margin-top:25px}.chat-head{padding:15px 18px}}
</style>
</head>
<body>
<main>
<div class="brand">askxiaolu.</div>
<h1>你好，我是小鹿学姐。</h1>
<p class="intro">博士在读，分享科研日常、AI 工具和学习经验。这里是我的个人小站，也希望成为一个可以继续交流的地方。</p>
<a class="profile" href="https://www.rednote.com/user/profile/5f9e4300000000000101d3d3" target="_blank" rel="noopener noreferrer">在小红书找到我 ↗</a>
<section class="chat" aria-labelledby="chat-title">
<div class="chat-head"><h2 id="chat-title">问小鹿</h2><span class="status">准备中</span></div>
<div class="messages" role="log" aria-label="问答对话" aria-live="polite"><div class="welcome"><strong>有什么想问小鹿的？</strong><p>问答开放后，我的 AI 助手会根据教程和答疑资料提供初步回答，并推荐相关视频。<br>目前正在整理知识库，暂时还不能发送问题。</p></div></div>
<form aria-label="提问区域"><div class="composer"><textarea aria-label="你的问题" placeholder="知识库准备中，问答即将开放…" disabled></textarea><button type="button" disabled>发送 ↑</button></div><p class="note">AI 助手 · 根据小鹿的内容整理，非本人实时回复。</p></form>
</section>
<footer>© 2026 Ask Xiaolu · 小鹿学姐</footer>
</main>
</body>
</html>
