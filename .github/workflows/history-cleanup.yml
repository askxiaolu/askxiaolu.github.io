name: Remove historical prompt file
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact current main commit SHA
        required: true
        type: string
      confirmation:
        description: Type REMOVE-PROMPT-HISTORY to rewrite main history
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: one-time-history-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.inputs.confirmation == 'REMOVE-PROMPT-HISTORY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite prompt path and verify latest files are identical
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          node --input-type=module - refs/remotes/origin/main "$EXPECTED_HEAD" <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdtempSync,rmSync} from 'node:fs';
          import {join} from 'node:path';
          import {tmpdir} from 'node:os';
          import assert from 'node:assert/strict';
          
          // Rewrites only the selected branch. Run in an isolated clone first.
          const ref=process.argv[2];
          const expected=process.argv[3];
          assert.match(expected||'',/^[a-f0-9]{40}$/);
          assert.ok(['refs/heads/main','refs/remotes/origin/main'].includes(ref));
          const git=(args,input,env={})=>execFileSync('git',args,{input,env:{...process.env,...env},maxBuffer:16*1024*1024});
          const run=(...args)=>git(args).toString().trim();
          assert.equal(run('rev-parse',ref),expected,'Branch changed; stop and review.');
          const target='lib/scope-prompt.md';
          assert.equal(run('ls-tree','-r','--name-only',expected,'--',target),'','Current tree must already exclude the private prompt.');
          const scratch=mkdtempSync(join(tmpdir(),'xiaolu-history-'));
          const env={GIT_INDEX_FILE:join(scratch,'index'),GIT_WORK_TREE:scratch};
          const mapping=new Map();let changed=0;
          try{
           for(const old of run('rev-list','--reverse','--topo-order',expected).split('\n')){
            const raw=git(['cat-file','commit',old]);
            const boundary=raw.indexOf('\n\n');assert.ok(boundary>0);
            const header=raw.subarray(0,boundary).toString('utf8');
            const fields=header.split(/\n(?! )/);
            const tree=fields.find(h=>h.startsWith('tree ')).slice(5);
            git(['read-tree',tree],undefined,env);
            git(['update-index','--force-remove','--',target],undefined,env);
            const newTree=git(['write-tree'],undefined,env).toString().trim();
            const parents=fields.filter(h=>h.startsWith('parent ')).map(h=>h.slice(7));
            const newParents=parents.map(p=>{assert.ok(mapping.has(p));return mapping.get(p);});
            if(tree===newTree&&parents.every((p,i)=>p===newParents[i])){mapping.set(old,old);continue;}
            let index=0;
            const newFields=fields.filter(h=>!h.startsWith('gpgsig ')&&!h.startsWith('gpgsig-sha256 ')&&!h.startsWith('mergetag ')).map(h=>h.startsWith('tree ')?'tree '+newTree:h.startsWith('parent ')?'parent '+newParents[index++]:h);
            const rebuilt=Buffer.concat([Buffer.from(newFields.join('\n')+'\n\n'),raw.subarray(boundary+2)]);
            const next=git(['hash-object','-t','commit','-w','--stdin'],rebuilt).toString().trim();
            mapping.set(old,next);changed++;
           }
           const result=mapping.get(expected);
           assert.equal(run('rev-parse',expected+'^{tree}'),run('rev-parse',result+'^{tree}'),'Latest files changed. Refuse update.');
           assert.equal(run('rev-list','--count',expected),run('rev-list','--count',result),'Commit count changed.');
           assert.equal(run('log','--format=%H',result,'--',target),'','Prompt remains in branch history.');
           run('update-ref',ref,result,expected);
           console.log(JSON.stringify({old:expected,new:result,commits:mapping.size,rewritten:changed,latestTreeUnchanged:true,promptPathRemoved:true}));
          }finally{rmSync(scratch,{recursive:true,force:true});}
          
          NODE
      - name: Replace main only if its original SHA is unchanged
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: git push origin refs/remotes/origin/main:refs/heads/main --force-with-lease=refs/heads/main:"$EXPECTED_HEAD"
